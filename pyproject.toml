[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-pipelines"
version = "0.1.0"
description = "Mid-level orchestrator for bioacoustics DL training, prediction, and evaluation pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0"}
dependencies = [
    "bioacoustics-dl-toolbox",
    "pydantic>=2.7.0",
    "pre-commit>=3.7",
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "soundfile>=0.12.1",
    "pandas>=2.2.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pandas-stubs>=2.2.0",
    "pydantic>=2.7.0",
]

[project.scripts]
alpaca-pipelines = "alpaca_pipelines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "bioacoustics_dl_toolbox.*",
    "torch.*",
    "soundfile.*",
    "tensorboardX.*",
]
ignore_missing_imports = true
