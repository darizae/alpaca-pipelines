[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-pipelines"
version = "0.1.0"
description = "Mid-level orchestrator for bioacoustics DL training, prediction, and evaluation pipelines."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Daniel Ariza"}]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "soundfile>=0.12.1",
    "resampy>=0.4.2",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "matplotlib>=3.7.0",
    "Pillow>=9.5.0",
    "tensorboardX>=2.6.0",
    "pandas>=2.2.0",
    "joblib>=1.3.0",
    "scikit-learn>=1.3.0",
]

[project.urls]
Repository = "https://github.com/darizae/alpaca-pipelines"
Issues = "https://github.com/darizae/alpaca-pipelines/issues"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "ruff==0.15.5",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pandas-stubs>=2.2.0",
    "pydantic>=2.7.0",
]

[project.scripts]
alpaca-pipelines = "alpaca_pipelines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/bioacoustics_dl_toolbox"]
ignore = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = "^src/bioacoustics_dl_toolbox/"

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "soundfile.*",
    "tensorboardX.*",
    "sklearn.*",
    "joblib.*",
    "bioacoustics_dl_toolbox.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bioacoustics_dl_toolbox.*"]
ignore_errors = true
